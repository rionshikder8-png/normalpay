name: aps_reader
description: APS Reader - Adverune Payment System. Payment monitoring and real-time alerts.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  crypto: ^3.0.6
  permission_handler: ^12.0.1
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.2
  connectivity_plus: ^6.1.5
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
