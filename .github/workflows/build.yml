name: Build APS Reader APK

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aps-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate missing platform scaffolding (wrapper, no overwrite of app files)
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            flutter create --platforms=android --org store.adverune --project-name aps_reader /tmp/aps_seed
            mkdir -p android/gradle/wrapper
            cp /tmp/aps_seed/android/gradlew android/gradlew
            cp /tmp/aps_seed/android/gradlew.bat android/gradlew.bat
            cp /tmp/aps_seed/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
            chmod +x android/gradlew
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        run: |
          if [ -d test ]; then flutter test; else echo "No tests yet"; fi

      - name: Prepare signing key (CI debug-grade key unless secrets provided)
        env:
          KEYSTORE_B64: ${{ secrets.APS_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.APS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.APS_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > android/key.properties
            echo "Using production signing key from secrets"
          else
            keytool -genkey -keystore android/app/ci.keystore -storepass aps-ci-build -alias apsci -keypass aps-ci-build -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=APS Reader CI,O=Adverune,C=BD"
            {
              echo "storeFile=ci.keystore"
              echo "storePassword=aps-ci-build"
              echo "keyAlias=apsci"
              echo "keyPassword=aps-ci-build"
            } > android/key.properties
            echo "::warning::No production keystore secrets set. Using a temporary CI key. This APK cannot update a build signed with another key."
          fi

      - name: Build release APK
        run: |
          # Flutter's post-build APK lookup does not match this project's Gradle output dir
          # (android/app/build/outputs). Gradle itself must still succeed; verify via the file.
          flutter build apk --release 2>&1 | tee build.log || true
          if grep -q "BUILD FAILED\|FAILURE: Build failed\|e: file://" build.log; then
            echo "::error::Gradle compilation failed"; exit 1
          fi

      - name: Collect APK
        run: |
          mkdir -p final_apk
          echo "APK candidates:"; find . -name "*.apk" -type f -not -path "./final_apk/*"
          APK=$(find . -name "app-release.apk" -type f -not -path "./final_apk/*" | head -1)
          test -n "$APK" || { echo "::error::No release APK produced"; exit 1; }
          cp "$APK" final_apk/APS-Reader-release.apk
          ls -la final_apk

      - uses: actions/upload-artifact@v4
        with:
          name: aps-reader-apk
          path: final_apk/APS-Reader-release.apk
          if-no-files-found: error
