name: Build Normal Pay SMS Reader APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Collect APK
        if: always()
        run: |
          mkdir -p final_apk
          find . -name "*.apk" -type f -exec cp {} final_apk/ \;
          echo "=== Collected APKs ==="
          ls -la final_apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: normal-pay-sms-reader-apk
          path: final_apk/*.apk
          if-no-files-found: error
