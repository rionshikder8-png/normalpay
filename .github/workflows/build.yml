name: Build Normal Pay SMS Reader APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # সাইনিং কি (keystore) তৈরি করা হচ্ছে
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        run: flutter build apk --release
        continue-on-error: true

      - name: Search and Copy APK
        if: always()
        run: |
          mkdir -p final_apk
          echo "Searching for APK files..."
          find . -name "*.apk" -type f
          # শুধু signed apk কপি করব
          find . -name "app-release.apk" -type f -exec cp {} final_apk/ \;
          echo "=== Files in final_apk ==="
          ls -la final_apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: normal-pay-sms-reader-apk-signed
          path: final_apk/app-release.apk
          if-no-files-found: error
